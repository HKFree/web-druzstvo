# Příklad HTTPS VirtualHost pro Apache2 na stejném stroji jako Docker Compose.
# Upravte ServerName, cesty k vlastnímu certifikátu a případně port backendu.
<VirtualHost *:443>
    ServerName druzstvo.example.cz

    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/hkfree-fullchain.pem
    SSLCertificateKeyFile /etc/ssl/private/hkfree.key

    ProxyRequests Off
    ProxyPreserveHost On
    # Nahraďte hlavičky od klienta důvěryhodnými hodnotami této HTTPS proxy.
    ProxyAddHeaders Off
    RequestHeader unset Forwarded
    RequestHeader unset X-Forwarded-For
    RequestHeader set X-Forwarded-Host "druzstvo.example.cz"
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"

    # Keystatic odesílá PDF jako base64 v JSON; aplikace přijímá nejvýše 16 MiB.
    LimitRequestBody 16777216
    ProxyPass / http://127.0.0.1:4321/ connectiontimeout=5 timeout=120
    ProxyPassReverse / http://127.0.0.1:4321/
</VirtualHost>
