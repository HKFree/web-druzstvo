# Direktivy pro EXISTUJÍCÍ HTTPS VirtualHost druzstvo.hkfree.org.
# Ponechte jeho stávající certifikát a obsluhu původního webu.
# Aplikaci sestavte s BASE_PATH=/v2 a DOMAIN=druzstvo.hkfree.org.
# Tyto ProxyPass direktivy dejte PŘED případné obecnější ProxyPass /.
ProxyRequests Off
RedirectMatch 302 ^/v2$ /v2/

<Location /v2/>
    ProxyPreserveHost On
    ProxyAddHeaders Off
    RequestHeader unset Forwarded
    RequestHeader unset X-Forwarded-For
    RequestHeader set X-Forwarded-Host "druzstvo.hkfree.org"
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"
    LimitRequestBody 16777216
</Location>

# Prefix se zachovává také na backendu; Astro s ním počítá.
ProxyPass /v2/ http://127.0.0.1:4321/v2/ connectiontimeout=5 timeout=120
ProxyPassReverse /v2/ http://127.0.0.1:4321/v2/
