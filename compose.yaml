services:
  web:
    build:
      context: .
      args:
        DOMAIN: ${DOMAIN:?Nastavte DOMAIN v souboru .env}
        BASE_PATH: ${BASE_PATH:-/}
    restart: unless-stopped
    ports:
      - '127.0.0.1:${WEB_PORT:-4321}:4321'
    environment:
      AUTH_MODE: oidc
      AUTH_ORIGIN: https://${DOMAIN:?Nastavte DOMAIN v souboru .env}
      OIDC_ISSUER: ${OIDC_ISSUER:?Nastavte OIDC_ISSUER v souboru .env}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:?Nastavte OIDC_CLIENT_ID v souboru .env}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?Nastavte OIDC_CLIENT_SECRET v souboru .env}
      OIDC_CLIENT_AUTH_METHOD: ${OIDC_CLIENT_AUTH_METHOD:-client_secret_basic}
      OIDC_ALLOW_ALL_AUTHENTICATED: ${OIDC_ALLOW_ALL_AUTHENTICATED:-false}
      OIDC_ALLOWED_SUBJECTS: ${OIDC_ALLOWED_SUBJECTS:-}
      OIDC_ALLOWED_EMAILS: ${OIDC_ALLOWED_EMAILS:-}
    volumes:
      - content:/app/data

volumes:
  content:
